<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>Tactical Touch Shooter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-item"><span class="hud-label">PUNTOS</span><span id="score">0</span></div>
        <div class="hud-item"><span class="hud-label">OLEADA</span><span id="wave">1</span></div>
      </div>
      <div class="hud-right">
        <div id="lives" class="lives"></div>
      </div>
    </div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1>TACTICAL<span>SHOOTER</span></h1>
      <p class="tagline">Defiende la zona. Toca y arrastra para moverte.</p>
      <ul class="instructions">
        <li>Arrastra para mover tu nave</li>
        <li>Disparo automático constante</li>
        <li>Destruye enemigos y esquiva sus disparos</li>
        <li>Recoge <span class="pwr">power-ups</span> para mejorar</li>
      </ul>
      <button id="start-btn" class="btn">JUGAR</button>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h1 class="go">MISIÓN<span>FALLIDA</span></h1>
      <div class="final-stats">
        <div><span class="hud-label">PUNTUACIÓN</span><span id="final-score">0</span></div>
        <div><span class="hud-label">OLEADA</span><span id="final-wave">1</span></div>
        <div><span class="hud-label">RÉCORD</span><span id="best-score">0</span></div>
      </div>
      <button id="restart-btn" class="btn">REINTENTAR</button>
    </div>

    <!-- Pause button -->
    <button id="pause-btn" class="icon-btn hidden">II</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
